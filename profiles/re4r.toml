[game]
id              = "re4r"
name            = "Resident Evil 4 (2023)"
tex_suffix      = "143221013"                 # [guide] RE4R texture version suffix
natives_root    = "natives/STM"               # [guide]
packaging       = ["loose_archive", "pak"]    # [TBD-spike] which Fluffy accepts for RE4R
pak_script      = "Create-PAK-2023.bat"       # [guide] REtool script for 2023-or-older games
noesis_export   = "-b"                        # optional (Noesis is): ?cmode export options (-b = no dialog, CLAUDE.md §9)
file_list       = "TBD"                       # [TBD-spike] PAK file list source/version
noesis_game     = "RE4"                       # optional: the RE plugin's name for RE4R (its RE4NativesPath.txt)
sound_dir       = "_chainsaw/sound/wwise"     # [game data] optional: Wwise banks (.sbnk) and packages (.spck), CLAUDE.md §10
movie_sound     = "ch_{id}_"                  # [game data] optional: a movie's sound packages there
